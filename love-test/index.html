<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测测你的爱情语言 | Love Language Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0a0f;
  --surface:#141419;
  --surface2:#1e1e28;
  --accent:#e8826a;
  --accent2:#d4a574;
  --accent3:#c9a0dc;
  --text:#e8e8e8;
  --text2:#8888aa;
  --radius:16px;
}

body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* 渐变光晕背景 */
.bg-glow{
  position:fixed;
  width:400px;height:400px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.15;
  pointer-events:none;
  z-index:0;
}
.bg-glow.top{top:-100px;right:-100px;background:var(--accent)}
.bg-glow.bottom{bottom:-100px;left:-100px;background:var(--accent3)}

#app{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:520px;
  background:var(--surface);
  border-radius:var(--radius);
  border:1px solid rgba(255,255,255,.06);
  padding:36px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  position:relative;
  overflow:hidden;
}

/* === 启动页 === */
.screen-start{text-align:center}
.screen-start .icon{
  font-size:56px;
  margin-bottom:12px;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:.8}
  50%{transform:scale(1.08);opacity:1}
}
.screen-start h1{
  font-size:26px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.screen-start .subtitle{
  color:var(--text2);
  font-size:14px;
  margin-bottom:28px;
  line-height:1.6;
}
.screen-start .info-row{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-bottom:28px;
  font-size:13px;
  color:var(--text2);
}
.screen-start .info-row span{
  display:flex;
  align-items:center;
  gap:5px;
}

.btn-primary{
  display:block;
  width:100%;
  padding:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:17px;
  font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
  transition:all .3s ease;
  box-shadow:0 8px 24px rgba(232,130,106,.3);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(232,130,106,.4);
}
.btn-primary:active{transform:translateY(0)}

.btn-secondary{
  display:block;
  width:100%;
  padding:14px;
  background:var(--surface2);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  color:var(--text);
  font-size:15px;
  font-weight:500;
  cursor:pointer;
  transition:all .25s ease;
  margin-top:12px;
}
.btn-secondary:hover{
  background:#25252f;
  border-color:rgba(255,255,255,.18);
}

/* === 答题页 === */
.screen-quiz{display:none}
.progress-bar{
  width:100%;
  height:4px;
  background:rgba(255,255,255,.08);
  border-radius:2px;
  margin-bottom:24px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent3));
  border-radius:2px;
  transition:width .4s ease;
  width:0%;
}
.q-meta{
  font-size:13px;
  color:var(--text2);
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
}
.q-text{
  font-size:18px;
  font-weight:600;
  line-height:1.5;
  margin-bottom:24px;
}
.options{display:flex;flex-direction:column;gap:10px}
.option{
  padding:14px 16px;
  background:var(--surface2);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  color:var(--text);
  font-size:15px;
  cursor:pointer;
  transition:all .2s ease;
  text-align:left;
  line-height:1.5;
}
.option:hover{
  border-color:var(--accent);
  background:#25252f;
  transform:translateX(4px);
}
.option:active{transform:scale(.98)}

/* === 结果页 === */
.screen-result{display:none;text-align:center}
.result-badge{
  width:80px;height:80px;
  margin:0 auto 16px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  animation:popIn .5s ease;
}
@keyframes popIn{
  0%{transform:scale(0)}
  70%{transform:scale(1.15)}
  100%{transform:scale(1)}
}
.result-title{
  font-size:24px;
  font-weight:700;
  margin-bottom:6px;
}
.result-subtitle{
  font-size:14px;
  color:var(--text2);
  margin-bottom:20px;
}
.result-desc{
  text-align:left;
  font-size:14px;
  line-height:1.8;
  color:#bbb;
  background:var(--surface2);
  padding:18px;
  border-radius:12px;
  margin-bottom:20px;
}
.result-stats{
  display:flex;
  gap:12px;
  margin-bottom:24px;
}
.stat-item{
  flex:1;
  background:var(--surface2);
  border-radius:12px;
  padding:14px 8px;
  text-align:center;
}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.stat-value{font-size:18px;font-weight:700}
.stat-bar{
  width:100%;
  height:6px;
  background:rgba(255,255,255,.08);
  border-radius:3px;
  margin-top:6px;
  overflow:hidden;
}
.stat-bar-fill{
  height:100%;
  border-radius:3px;
  transition:width .8s ease;
}

.result-actions{display:flex;gap:10px}
.result-actions button{flex:1}

/* === 页脚 === */
.footer{
  text-align:center;
  font-size:11px;
  color:rgba(255,255,255,.15);
  margin-top:20px;
}

/* 动画 */
.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* 加载点 */
.loading-dots{
  display:inline-flex;
  gap:4px;
}
.loading-dots span{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--accent);
  animation:bounce 1.4s infinite ease-in-out both;
}
.loading-dots span:nth-child(1){animation-delay:-.32s}
.loading-dots span:nth-child(2){animation-delay:-.16s}
@keyframes bounce{
  0%,80%,100%{transform:scale(0)}
  40%{transform:scale(1)}
}
</style>
</head>
<body>

<div class="bg-glow top"></div>
<div class="bg-glow bottom"></div>

<div id="app">
  <div class="card">

    <!-- 启动页 -->
    <div id="screen-start" class="screen-start fade-in">
      <div class="icon">💕</div>
      <h1>测测你的爱情语言</h1>
      <p class="subtitle">每个人表达爱的方式不同<br>你是哪一种？8道题揭开答案</p>
      <div class="info-row">
        <span>⏱️ 2分钟</span>
        <span>📋 8道题</span>
        <span>🔥 10万+人测过</span>
      </div>
      <button class="btn-primary" onclick="startQuiz()">开始测试</button>
    </div>

    <!-- 答题页 -->
    <div id="screen-quiz" class="screen-quiz">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="q-meta">
        <span id="qIndex">第 1 题</span>
        <span id="qTotal">/ 8</span>
      </div>
      <div class="q-text" id="qText">题目加载中...</div>
      <div class="options" id="options"></div>
    </div>

    <!-- 结果页 -->
    <div id="screen-result" class="screen-result">
      <div class="result-badge" id="resultBadge">🌟</div>
      <div class="result-title" id="resultTitle">结果标题</div>
      <div class="result-subtitle" id="resultSubtitle">结果副标题</div>
      <div class="result-stats" id="resultStats"></div>
      <div class="result-desc" id="resultDesc">结果描述</div>
      <div class="result-actions">
        <button class="btn-secondary" onclick="restart()">再测一次</button>
        <button class="btn-secondary" onclick="shareResult()">分享结果</button>
      </div>
      <div class="footer">趣味测试 · 仅供参考娱乐</div>
    </div>

  </div>
</div>

<script>
// ===== 题目数据 =====
const questions = [
  {
    text: "当你想念一个人时，你最想做的事情是？",
    options: [
      {text:"给TA打一个电话，听听TA的声音",type:"words"},
      {text:"飞过去给TA一个大大的拥抱",type:"touch"},
      {text:"给TA准备一份精心挑选的礼物",type:"gifts"},
      {text:"放下一切去陪TA做TA喜欢的事",type:"time"}
    ]
  },
  {
    text: "对方做什么事情会让你最感动？",
    options: [
      {text:"认真地对你说"我爱你"并说出原因",type:"words"},
      {text:"不经意间牵起你的手或搂住你",type:"touch"},
      {text:"记住你随口提过想要的小东西买给你",type:"gifts"},
      {text:"放下手机，全身心陪你一整天",type:"time"}
    ]
  },
  {
    text: "你觉得最浪漫的约会是？",
    options: [
      {text:"深夜长谈，聊彼此的内心世界",type:"words"},
      {text:"窝在沙发上一起看电影，靠在一起",type:"touch"},
      {text:"收到TA准备的惊喜花束或小礼物",type:"gifts"},
      {text:"一起去旅行，创造只属于你们的回忆",type:"time"}
    ]
  },
  {
    text: "吵架之后，你希望对方怎么道歉？",
    options: [
      {text:"真诚地说出"对不起"和原因",type:"words"},
      {text:"过来抱住你，什么都不说",type:"touch"},
      {text:"带一份你爱吃的甜点来找你",type:"gifts"},
      {text:"专门抽出时间陪你散心",type:"time"}
    ]
  },
  {
    text: "你最容易因为什么而心动？",
    options: [
      {text:"TA对你说的一句走心的话",type:"words"},
      {text:"TA无意间温柔的肢体接触",type:"touch"},
      {text:"TA送你的一个用心的小物件",type:"gifts"},
      {text:"TA愿意为你花时间和精力",type:"time"}
    ]
  },
  {
    text: "你觉得爱情中最重要的仪式感是？",
    options: [
      {text:"经常表达爱意，说甜言蜜语",type:"words"},
      {text:"日常的拥抱、亲吻和牵手",type:"touch"},
      {text:"纪念日和节日互送礼物",type:"gifts"},
      {text:"定期约会，专属两个人的时间",type:"time"}
    ]
  },
  {
    text: "如果TA要给你一个惊喜，你最希望是？",
    options: [
      {text:"写给你一封真挚的手写信",type:"words"},
      {text:"从背后抱住你",type:"touch"},
      {text:"送你一直想要的东西",type:"gifts"},
      {text:"突然带你去了你一直想去的地方",type:"time"}
    ]
  },
  {
    text: "你觉得一个人爱你最深的表现是？",
    options: [
      {text:"在朋友面前自豪地夸你",type:"words"},
      {text:"忍不住想靠近你、碰触你",type:"touch"},
      {text:"愿意为你花钱、花心思准备礼物",type:"gifts"},
      {text:"愿意把最宝贵的时间留给你",type:"time"}
    ]
  }
];

// ===== 结果数据 =====
const results = {
  words:{
    badge:"💬",
    title:"言语表达型",
    subtitle:"Words of Affirmation",
    desc:"你的爱情语言是「言语表达」。对你来说，真诚的话语比什么都重要——一句"我爱你"、一句发自内心的夸奖、一封手写信，都能让你感受到深深的被爱。\n\n你渴望被看见、被认可。当对方用语言表达对你的欣赏和爱意时，你的心会瞬间被融化。\n\n💡 建议：找一个愿意对你"说出口"的伴侣，同时也要学会对TA表达你的感受。",
    color:"#e8826a"
  },
  touch:{
    badge:"🤗",
    title:"肢体接触型",
    subtitle:"Physical Touch",
    desc:"你的爱情语言是「肢体接触」。一个拥抱、一次牵手、一个不经意的靠近，对你来说胜过千言万语。\n\n你通过身体接触来感受安全和被爱。当对方在人群中自然地牵起你的手，或者在你难过时给你一个拥抱，你会觉得整个世界都安静了。\n\n💡 建议：你适合一个同样注重身体亲密感的伴侣，日常的触碰是你们的爱情保鲜剂。",
    color:"#d4a574"
  },
  gifts:{
    badge:"🎁",
    title:"精心礼物型",
    subtitle:"Receiving Gifts",
    desc:"你的爱情语言是「精心礼物」。对你来说，礼物不是物质，而是心意的载体——TA记住你随口说的话，为你准备一个小惊喜，这让你感受到被珍视。\n\n你在乎的不是价格，而是「TA花了心思」。一张手写贺卡、一朵路边买的花，都可能让你感动很久。\n\n💡 建议：找一个懂得用细节表达爱的伴侣，同时也要告诉TA——你更看重用心而非昂贵。",
    color:"#c9a0dc"
  },
  time:{
    badge:"⏳",
    title:"高质量陪伴型",
    subtitle:"Quality Time",
    desc:"你的爱情语言是「高质量陪伴」。对你来说，最珍贵的是对方的时间和注意力——放下手机、全身心陪你的那一刻，就是最深的爱。\n\n你不贪心礼物或甜言蜜语，你想要的是：一起散步、一起做饭、一起看星星……那些只属于你们的时光。\n\n💡 建议：找一个愿意把时间留给你的伴侣，并且你们要约定好——在一起的时候就全心全意。",
    color:"#7ec8a4"
  }
};

// ===== 测试逻辑 =====
let currentQ = 0;
let scores = {words:0,touch:0,gifts:0,time:0};

function startQuiz(){
  currentQ = 0;
  scores = {words:0,touch:0,gifts:0,time:0};
  showScreen("quiz");
  renderQuestion();
}

function showScreen(name){
  document.getElementById("screen-start").style.display = name==="start"?"block":"none";
  document.getElementById("screen-quiz").style.display = name==="quiz"?"block":"none";
  document.getElementById("screen-result").style.display = name==="result"?"block":"none";
}

function renderQuestion(){
  const q = questions[currentQ];
  const progress = ((currentQ+1)/questions.length)*100;

  document.getElementById("progressFill").style.width = progress+"%";
  document.getElementById("qIndex").textContent = "第 "+(currentQ+1)+" 题";
  document.getElementById("qTotal").textContent = "/ "+questions.length;
  document.getElementById("qText").textContent = q.text;

  const optsContainer = document.getElementById("options");
  optsContainer.innerHTML = "";

  q.options.forEach((opt,i)=>{
    const btn = document.createElement("button");
    btn.className = "option fade-in";
    btn.style.animationDelay = (i*0.08)+"s";
    btn.textContent = opt.text;
    btn.onclick = ()=>selectOption(opt.type);
    optsContainer.appendChild(btn);
  });
}

function selectOption(type){
  scores[type]++;

  if(currentQ < questions.length-1){
    currentQ++;
    renderQuestion();
  } else {
    // 显示加载动画
    document.getElementById("screen-quiz").style.display = "block";
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("qText").innerHTML = '<div style="text-align:center;padding:30px 0"><div style="font-size:40px;margin-bottom:12px">🔮</div><div>正在分析你的爱情语言<span class="loading-dots"><span></span><span></span><span></span></span></div></div>';
    document.getElementById("options").innerHTML = "";

    setTimeout(()=>{
      showResult();
    }, 1500);
  }
}

function showResult(){
  // 找出最高分
  let maxType = "words";
  let maxScore = 0;
  for(let type in scores){
    if(scores[type] > maxScore){
      maxScore = scores[type];
      maxType = type;
    }
  }

  const r = results[maxType];

  document.getElementById("resultBadge").textContent = r.badge;
  document.getElementById("resultBadge").style.background = r.color+"22";
  document.getElementById("resultBadge").style.boxShadow = "0 0 40px "+r.color+"44";
  document.getElementById("resultTitle").textContent = r.title;
  document.getElementById("resultSubtitle").textContent = r.subtitle;
  document.getElementById("resultDesc").innerHTML = r.desc.replace(/\n/g,"<br><br>");

  // 渲染各维度得分
  const labels = {words:"言语表达",touch:"肢体接触",gifts:"精心礼物",time:"陪伴"};
  const colors = {words:"#e8826a",touch:"#d4a574",gifts:"#c9a0dc",time:"#7ec8a4"};
  let statsHTML = "";
  for(let type in scores){
    const pct = Math.round(scores[type]/questions.length*100);
    statsHTML += '<div class="stat-item">'+
      '<div class="stat-label">'+labels[type]+'</div>'+
      '<div class="stat-value" style="color:'+colors[type]+'">'+pct+'%</div>'+
      '<div class="stat-bar"><div class="stat-bar-fill" style="background:'+colors[type]+';width:'+pct+'%"></div></div>'+
    '</div>';
  }
  document.getElementById("resultStats").innerHTML = statsHTML;

  showScreen("result");
}

function restart(){
  showScreen("start");
  document.getElementById("screen-start").classList.add("fade-in");
  setTimeout(()=>document.getElementById("screen-start").classList.remove("fade-in"),500);
}

function shareResult(){
  const text = "我测了我的爱情语言，结果是"+document.getElementById("resultTitle").textContent+"！你也来试试吧~";
  if(navigator.share){
    navigator.share({title:"测测你的爱情语言",text:text,url:window.location.href});
  } else {
    // 复制到剪贴板
    const textarea = document.createElement("textarea");
    textarea.value = text + " " + window.location.href;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    document.body.removeChild(textarea);
    alert("已复制到剪贴板，快去分享吧！");
  }
}
</script>

</body>
</html>
