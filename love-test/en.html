<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>What's Your Love Language? | Personality Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#0a0a0f;
  --surface:#141419;
  --surface2:#1e1e28;
  --accent:#e8826a;
  --accent2:#d4a574;
  --accent3:#c9a0dc;
  --text:#e8e8e8;
  --text2:#8888aa;
  --radius:16px;
}

body{
  font-family:-apple-system,'Segoe UI',Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

.bg-glow{
  position:fixed;
  width:400px;height:400px;
  border-radius:50%;
  filter:blur(80px);
  opacity:.15;
  pointer-events:none;
  z-index:0;
}
.bg-glow.top{top:-100px;right:-100px;background:var(--accent)}
.bg-glow.bottom{bottom:-100px;left:-100px;background:var(--accent3)}

#app{
  position:relative;
  z-index:1;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:520px;
  background:var(--surface);
  border-radius:var(--radius);
  border:1px solid rgba(255,255,255,.06);
  padding:36px 28px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  position:relative;
  overflow:hidden;
}

.screen-start{text-align:center}
.screen-start .icon{
  font-size:56px;
  margin-bottom:12px;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:.8}
  50%{transform:scale(1.08);opacity:1}
}
.screen-start h1{
  font-size:26px;
  font-weight:700;
  letter-spacing:1px;
  margin-bottom:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent3));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.screen-start .subtitle{
  color:var(--text2);
  font-size:14px;
  margin-bottom:28px;
  line-height:1.6;
}
.screen-start .info-row{
  display:flex;
  justify-content:center;
  gap:20px;
  margin-bottom:28px;
  font-size:13px;
  color:var(--text2);
}
.screen-start .info-row span{
  display:flex;
  align-items:center;
  gap:5px;
}

.btn-primary{
  display:block;
  width:100%;
  padding:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  border-radius:12px;
  color:#fff;
  font-size:17px;
  font-weight:600;
  letter-spacing:1px;
  cursor:pointer;
  transition:all .3s ease;
  box-shadow:0 8px 24px rgba(232,130,106,.3);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(232,130,106,.4);
}
.btn-primary:active{transform:translateY(0)}

.btn-secondary{
  display:block;
  width:100%;
  padding:14px;
  background:var(--surface2);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  color:var(--text);
  font-size:15px;
  font-weight:500;
  cursor:pointer;
  transition:all .25s ease;
  margin-top:12px;
}
.btn-secondary:hover{
  background:#25252f;
  border-color:rgba(255,255,255,.18);
}

.screen-quiz{display:none}
.progress-bar{
  width:100%;
  height:4px;
  background:rgba(255,255,255,.08);
  border-radius:2px;
  margin-bottom:24px;
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent3));
  border-radius:2px;
  transition:width .4s ease;
  width:0%;
}
.q-meta{
  font-size:13px;
  color:var(--text2);
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
}
.q-text{
  font-size:18px;
  font-weight:600;
  line-height:1.5;
  margin-bottom:24px;
}
.options{display:flex;flex-direction:column;gap:10px}
.option{
  padding:14px 16px;
  background:var(--surface2);
  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;
  color:var(--text);
  font-size:15px;
  cursor:pointer;
  transition:all .2s ease;
  text-align:left;
  line-height:1.5;
}
.option:hover{
  border-color:var(--accent);
  background:#25252f;
  transform:translateX(4px);
}
.option:active{transform:scale(.98)}

.screen-result{display:none;text-align:center}
.result-badge{
  width:80px;height:80px;
  margin:0 auto 16px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  animation:popIn .5s ease;
}
@keyframes popIn{
  0%{transform:scale(0)}
  70%{transform:scale(1.15)}
  100%{transform:scale(1)}
}
.result-title{
  font-size:24px;
  font-weight:700;
  margin-bottom:6px;
}
.result-subtitle{
  font-size:14px;
  color:var(--text2);
  margin-bottom:20px;
}
.result-desc{
  text-align:left;
  font-size:14px;
  line-height:1.8;
  color:#bbb;
  background:var(--surface2);
  padding:18px;
  border-radius:12px;
  margin-bottom:20px;
}
.result-stats{
  display:flex;
  gap:12px;
  margin-bottom:24px;
}
.stat-item{
  flex:1;
  background:var(--surface2);
  border-radius:12px;
  padding:14px 8px;
  text-align:center;
}
.stat-label{font-size:10px;color:var(--text2);margin-bottom:4px}
.stat-value{font-size:18px;font-weight:700}
.stat-bar{
  width:100%;
  height:6px;
  background:rgba(255,255,255,.08);
  border-radius:3px;
  margin-top:6px;
  overflow:hidden;
}
.stat-bar-fill{
  height:100%;
  border-radius:3px;
  transition:width .8s ease;
}

.result-actions{display:flex;gap:10px}
.result-actions button{flex:1}

.footer{
  text-align:center;
  font-size:11px;
  color:rgba(255,255,255,.15);
  margin-top:20px;
}

.fade-in{animation:fadeIn .4s ease}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.loading-dots{
  display:inline-flex;
  gap:4px;
}
.loading-dots span{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--accent);
  animation:bounce 1.4s infinite ease-in-out both;
}
.loading-dots span:nth-child(1){animation-delay:-.32s}
.loading-dots span:nth-child(2){animation-delay:-.16s}
@keyframes bounce{
  0%,80%,100%{transform:scale(0)}
  40%{transform:scale(1)}
}
</style>
</head>
<body>

<div class="bg-glow top"></div>
<div class="bg-glow bottom"></div>

<div id="app">
  <div class="card">

    <div id="screen-start" class="screen-start fade-in">
      <div class="icon">💕</div>
      <h1>What's Your Love Language?</h1>
      <p class="subtitle">Everyone expresses love differently.<br>Discover yours in just 8 questions!</p>
      <div class="info-row">
        <span>⏱️ 2 min</span>
        <span>📋 8 questions</span>
        <span>🔥 100K+ tested</span>
      </div>
      <button class="btn-primary" onclick="startQuiz()">Start Quiz</button>
    </div>

    <div id="screen-quiz" class="screen-quiz">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="q-meta">
        <span id="qIndex">Question 1</span>
        <span id="qTotal">/ 8</span>
      </div>
      <div class="q-text" id="qText">Loading...</div>
      <div class="options" id="options"></div>
    </div>

    <div id="screen-result" class="screen-result">
      <div class="result-badge" id="resultBadge">🌟</div>
      <div class="result-title" id="resultTitle">Result</div>
      <div class="result-subtitle" id="resultSubtitle">Subtitle</div>
      <div class="result-stats" id="resultStats"></div>
      <div class="result-desc" id="resultDesc">Description</div>
      <div class="result-actions">
        <button class="btn-secondary" onclick="restart()">Retake Quiz</button>
        <button class="btn-secondary" onclick="shareResult()">Share Result</button>
      </div>
      <div class="footer">Fun personality test · For entertainment only</div>
    </div>

  </div>
</div>

<script>
const questions = [
  {
    text: "When you miss someone, what do you most want to do?",
    options: [
      {text:"Call them just to hear their voice",type:"words"},
      {text:"Fly over and give them a big hug",type:"touch"},
      {text:"Prepare a carefully chosen gift for them",type:"gifts"},
      {text:"Drop everything and spend time doing what they love",type:"time"}
    ]
  },
  {
    text: "What would touch your heart the most?",
    options: [
      {text:"Hearing them sincerely say \"I love you\" and explain why",type:"words"},
      {text:"Having them naturally reach for your hand or pull you close",type:"touch"},
      {text:"Receiving something you once mentioned wanting offhand",type:"gifts"},
      {text:"Having them put their phone away and be fully present with you",type:"time"}
    ]
  },
  {
    text: "What's the most romantic date to you?",
    options: [
      {text:"A late-night deep conversation about your inner worlds",type:"words"},
      {text:"Cuddling on the couch watching a movie together",type:"touch"},
      {text:"Being surprised with flowers or a thoughtful gift",type:"gifts"},
      {text:"Traveling together to create memories just for the two of you",type:"time"}
    ]
  },
  {
    text: "After an argument, how would you want them to apologize?",
    options: [
      {text:"Sincerely say \"I'm sorry\" and explain why",type:"words"},
      {text:"Come over and hold you without saying a word",type:"touch"},
      {text:"Bring your favorite dessert to make it up to you",type:"gifts"},
      {text:"Set aside dedicated time to take you out and clear the air",type:"time"}
    ]
  },
  {
    text: "What makes your heart skip a beat most easily?",
    options: [
      {text:"A heartfelt sentence they said to you",type:"words"},
      {text:"An accidental gentle touch from them",type:"touch"},
      {text:"A small but meaningful object they gave you",type:"gifts"},
      {text:"The fact that they're willing to invest time and energy in you",type:"time"}
    ]
  },
  {
    text: "What's the most important sense of ritual in a relationship?",
    options: [
      {text:"Frequently expressing love with sweet words",type:"words"},
      {text:"Daily hugs, kisses, and holding hands",type:"touch"},
      {text:"Exchanging gifts on anniversaries and holidays",type:"gifts"},
      {text:"Regular date nights — dedicated time just for the two of you",type:"time"}
    ]
  },
  {
    text: "If they were to surprise you, what would you want most?",
    options: [
      {text:"A sincere handwritten letter just for you",type:"words"},
      {text:"A hug from behind when you least expect it",type:"touch"},
      {text:"Something you've always wanted",type:"gifts"},
      {text:"Being whisked away to a place you've always wanted to visit",type:"time"}
    ]
  },
  {
    text: "What's the deepest sign of love to you?",
    options: [
      {text:"Proudly talking about you in front of friends",type:"words"},
      {text:"Not being able to resist being close to you",type:"touch"},
      {text:"Willing to spend money and effort on gifts for you",type:"gifts"},
      {text:"Willing to give you their most precious time",type:"time"}
    ]
  }
];

const results = {
  words:{
    badge:"💬",
    title:"Words of Affirmation",
    subtitle:"You feel loved through spoken words",
    desc:"Your love language is Words of Affirmation. Sincere words matter more to you than anything — a heartfelt \"I love you,\" a genuine compliment, a handwritten letter — these make you feel deeply loved.\n\nYou crave being seen and acknowledged. When someone expresses their admiration and affection through words, your heart melts.\n\n💡 Tip: Find a partner who isn't afraid to say it out loud. And remember to express your own feelings too.",
    color:"#e8826a"
  },
  touch:{
    badge:"🤗",
    title:"Physical Touch",
    subtitle:"You feel loved through physical closeness",
    desc:"Your love language is Physical Touch. A hug, holding hands, an unexpected closeness — these speak louder than a thousand words to you.\n\nYou feel safe and loved through physical contact. When they naturally take your hand in a crowd, or hold you when you're sad, the whole world goes quiet.\n\n💡 Tip: You're best matched with someone who also values physical intimacy. Daily touch is your relationship's保鲜剂 — its preservative.",
    color:"#d4a574"
  },
  gifts:{
    badge:"🎁",
    title:"Receiving Gifts",
    subtitle:"You feel loved through thoughtful gestures",
    desc:"Your love language is Receiving Gifts. To you, a gift isn't about material things — it's a vessel for thoughtfulness. When they remember something you casually mentioned and surprise you with it, you feel truly cherished.\n\nIt's not about price. It's about \"they put thought into this.\" A handwritten card, a flower bought on the street — these can move you for a long time.\n\n💡 Tip: Find someone who expresses love through details. And let them know — it's the thought, not the price tag, that matters.",
    color:"#c9a0dc"
  },
  time:{
    badge:"⏳",
    title:"Quality Time",
    subtitle:"You feel loved through undivided attention",
    desc:"Your love language is Quality Time. To you, the most precious thing is their time and attention — putting the phone down, being fully present — that's the deepest form of love.\n\nYou don't need gifts or sweet words. You want: walks together, cooking together, stargazing... moments that belong only to the two of you.\n\n💡 Tip: Find someone willing to give you their time. And agree — when you're together, be fully there.",
    color:"#7ec8a4"
  }
};

let currentQ = 0;
let scores = {words:0,touch:0,gifts:0,time:0};

function startQuiz(){
  currentQ = 0;
  scores = {words:0,touch:0,gifts:0,time:0};
  showScreen("quiz");
  renderQuestion();
}

function showScreen(name){
  document.getElementById("screen-start").style.display = name==="start"?"block":"none";
  document.getElementById("screen-quiz").style.display = name==="quiz"?"block":"none";
  document.getElementById("screen-result").style.display = name==="result"?"block":"none";
}

function renderQuestion(){
  const q = questions[currentQ];
  const progress = ((currentQ+1)/questions.length)*100;

  document.getElementById("progressFill").style.width = progress+"%";
  document.getElementById("qIndex").textContent = "Question "+(currentQ+1);
  document.getElementById("qTotal").textContent = "/ "+questions.length;
  document.getElementById("qText").textContent = q.text;

  const optsContainer = document.getElementById("options");
  optsContainer.innerHTML = "";

  q.options.forEach((opt,i)=>{
    const btn = document.createElement("button");
    btn.className = "option fade-in";
    btn.style.animationDelay = (i*0.08)+"s";
    btn.textContent = opt.text;
    btn.onclick = ()=>selectOption(opt.type);
    optsContainer.appendChild(btn);
  });
}

function selectOption(type){
  scores[type]++;

  if(currentQ < questions.length-1){
    currentQ++;
    renderQuestion();
  } else {
    document.getElementById("screen-quiz").style.display = "block";
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("qText").innerHTML = '<div style="text-align:center;padding:30px 0"><div style="font-size:40px;margin-bottom:12px">🔮</div><div>Analyzing your love language<span class="loading-dots"><span></span><span></span><span></span></span></div></div>';
    document.getElementById("options").innerHTML = "";

    setTimeout(()=>{
      showResult();
    }, 1500);
  }
}

function showResult(){
  let maxType = "words";
  let maxScore = 0;
  for(let type in scores){
    if(scores[type] > maxScore){
      maxScore = scores[type];
      maxType = type;
    }
  }

  const r = results[maxType];

  document.getElementById("resultBadge").textContent = r.badge;
  document.getElementById("resultBadge").style.background = r.color+"22";
  document.getElementById("resultBadge").style.boxShadow = "0 0 40px "+r.color+"44";
  document.getElementById("resultTitle").textContent = r.title;
  document.getElementById("resultSubtitle").textContent = r.subtitle;
  document.getElementById("resultDesc").innerHTML = r.desc.replace(/\n/g,"<br><br>");

  const labels = {words:"Words",touch:"Touch",gifts:"Gifts",time:"Time"};
  const colors = {words:"#e8826a",touch:"#d4a574",gifts:"#c9a0dc",time:"#7ec8a4"};
  let statsHTML = "";
  for(let type in scores){
    const pct = Math.round(scores[type]/questions.length*100);
    statsHTML += '<div class="stat-item">'+
      '<div class="stat-label">'+labels[type]+'</div>'+
      '<div class="stat-value" style="color:'+colors[type]+'">'+pct+'%</div>'+
      '<div class="stat-bar"><div class="stat-bar-fill" style="background:'+colors[type]+';width:'+pct+'%"></div></div>'+
    '</div>';
  }
  document.getElementById("resultStats").innerHTML = statsHTML;

  showScreen("result");
}

function restart(){
  showScreen("start");
  document.getElementById("screen-start").classList.add("fade-in");
  setTimeout(()=>document.getElementById("screen-start").classList.remove("fade-in"),500);
}

function shareResult(){
  const text = "I took the Love Language Test and my result is "+document.getElementById("resultTitle").textContent+"! Try it too~";
  if(navigator.share){
    navigator.share({title:"What's Your Love Language?",text:text,url:window.location.href});
  } else {
    const textarea = document.createElement("textarea");
    textarea.value = text + " " + window.location.href;
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand("copy");
    document.body.removeChild(textarea);
    alert("Copied to clipboard! Go share it!");
  }
}
</script>

</body>
</html>
